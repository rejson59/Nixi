name: build-windows

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

# Anuluj starszy bieg dla tej samej gałęzi (oszczędność minut CI)
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Szybka informacja zwrotna: lint + samotest na Linuksie (bez budowania .exe)
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: System libraries for Qt (offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-image0 libxcb-render-util0 libxkbcommon0 fontconfig fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Generate icon
        run: python scripts/gen_icon.py

      - name: Self-test (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m nixi.selftest

  build:
    runs-on: windows-latest
    needs: checks
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Generate icon
        run: python scripts/gen_icon.py

      # Model mowy (~40 MB) pobierany jest z zewnętrznego mirrora — cache sprawia,
      # że kolejne buildy nie zależą od jego dostępności.
      - name: Cache VOSK model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vosk
          key: vosk-model-small-pl-0.22

      - name: Self-test (with acoustic wake-word test)
        env:
          # W CI brak modelu/głosu ma być błędem, a nie cichym pominięciem testu
          NIXI_REQUIRE_ACOUSTICS: "1"
          LOCALAPPDATA: ${{ runner.temp }}\vosk
        run: python -m nixi.selftest --acoustics

      - name: Build Nixi.exe
        run: pyinstaller --noconfirm --clean Nixi.spec

      - name: Verify artifact
        shell: pwsh
        run: |
          $exe = "dist/Nixi.exe"
          if (-not (Test-Path $exe)) { throw "Brak $exe" }
          $size = (Get-Item $exe).Length
          Write-Host ("Nixi.exe: {0:N1} MB" -f ($size / 1MB))
          if ($size -lt 10MB) { throw "Nixi.exe podejrzanie maly ($size B)" }
          # Smoke test: aplikacja okienkowa musi wystartowac i wyjsc z kodem 0 dla --version
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Nixi.exe --version nie zakonczyl sie w 120 s" }
          if ($p.ExitCode -ne 0) { throw "Nixi.exe --version zwrocil kod $($p.ExitCode)" }
          Write-Host "Smoke test OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nixi-windows-exe
          path: dist/Nixi.exe
          if-no-files-found: error
