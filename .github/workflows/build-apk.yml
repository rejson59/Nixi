name: Build APK

on:
  push:
    branches: [ "main", "arena/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          cache-read-only: false

      - name: Build APKs
        id: build
        continue-on-error: true
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease 2>&1 | tee gradle-output.log

      # Tymczasowy krok diagnostyczny: przy bledzie zapisuje log w repo,
      # zeby mozna go bylo przeczytac z zewnatrz (bez pobierania artefaktow).
      - name: Publish build log on failure
        if: steps.build.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout "${{ github.ref_name }}"
          mkdir -p ci
          tail -c 400000 gradle-output.log > ci/build-log.txt
          git add ci/build-log.txt
          git commit -m "ci: log z budowania [skip ci]"
          git push origin "${{ github.ref_name }}" || (git pull --rebase origin "${{ github.ref_name }}" && git push origin "${{ github.ref_name }}")

      - name: Upload APK artifacts
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NIXI-APK-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Report build status
        if: always()
        run: test "${{ steps.build.outcome }}" = "success"

  # Auto-release z tagiem v* (np. git tag v1.0.0 && git push --tags)
  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          generate_release_notes: true
