name: Build APK

on:
  push:
    branches: [ "main", "arena/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          cache-read-only: false

      - name: Testy jednostkowe + budowa APK
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain \
            testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Ogłoś błędy jako adnotacje (widoczne w API/Czytniku)
        if: failure()
        run: |
          # Kompilator Kotlina i Gradle piszą błędy w znanym formacie — wyciągamy
          # je jako ::error::, dzięki temu są widoczne w zakładce Checks bez
          # pobierania logu (przydatne też dla agentów/CI bez dostępu do blobów).
          grep -nE "(^e: |error: |FAILED|Execution failed for task|Caused by: |[0-9]+ tests? completed)" build.log 2>/dev/null \
            | head -20 | while IFS= read -r line; do echo "::error::$line"; done || true
          exit 1

      - name: Szczegóły w komentarzu do commita (gdy build padnie)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f build.log ]; then
            TAIL=$(tail -c 55000 build.log)
            printf 'Build/testy nie przeszły.\n\n```\n%s\n```\n' "$TAIL" > body.md
            gh api -X POST "/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
              -F body=@body.md >/dev/null 2>&1 || echo "Nie mogę dodać komentarza (brak uprawnień)."
          fi

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NIXI-APK-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # Auto-release z tagiem v* (np. git tag v1.0.0 && git push --tags)
  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          generate_release_notes: true
