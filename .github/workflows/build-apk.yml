name: Build APK

on:
  push:
    branches: [ "main", "arena/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          cache-read-only: false

      - name: Build APKs
        id: build
        continue-on-error: true
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease 2>&1 | tee gradle-output.log

      - name: Collect diagnostics
        if: always()
        id: diag
        run: |
          mkdir -p ci
          {
            echo "== build outcome: ${{ steps.build.outcome }} =="
            grep -E "BUILD (SUCCESS|FAIL)" gradle-output.log | tail -5 || true
            echo "== gradle tasks tail =="
            grep -E "^> Task" gradle-output.log | tail -15 || true
            echo "== APK find =="
            find . -name "*.apk" 2>/dev/null | head -20 || true
            echo "== outputs tree =="
            ls -laR app/build/outputs 2>/dev/null | head -60 || true
            echo "== log tail =="
            tail -c 60000 gradle-output.log || true
          } > ci/diag.txt 2>&1
          grep -h "^e: file" gradle-output.log | sort -u > ci/errors.txt || true

      - name: Upload APK artifacts
        id: upload
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NIXI-APK-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Tymczasowy krok diagnostyczny: przy bledzie zapisuje log w repo,
      # zeby mozna go bylo przeczytac z zewnatrz (bez pobierania artefaktow).
      - name: Publish diag on failure
        if: always() && (steps.build.outcome == 'failure' || steps.upload.outcome == 'failure')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout "${{ github.ref_name }}"
          git add ci/
          git commit -m "ci: diag z budowania [skip ci]"
          git push origin "${{ github.ref_name }}" || (git pull --rebase origin "${{ github.ref_name }}" && git push origin "${{ github.ref_name }}")

      - name: Report build status
        if: always()
        run: test "${{ steps.build.outcome }}-${{ steps.upload.outcome }}" = "success-success"

  # Auto-release z tagiem v* (np. git tag v1.0.0 && git push --tags)
  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          generate_release_notes: true
