# Konfiguracja lintera dla projektu Nixi.
# Jawna lista reguł — dzięki temu `ruff check .` daje ten sam wynik lokalnie i w CI,
# niezależnie od wersji ruffa i jego domyślnych ustawień.

target-version = "py311"
line-length = 120
exclude = [".venv", "build", "dist", "nixi/assets"]

[lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff
    "DTZ",  # naiwne daty
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "BLE",  # blind except (kod ma celowe `# noqa: BLE001` tam, gdzie to świadome)
]
ignore = [
    "PLW0108", # krótkie lambdy w callbackach Qt są tu czytelniejsze
    "E501",    # długość linii pilnuje formatowanie, nie lint
    "SIM105",  # try/except/pass bywa czytelniejsze niż contextlib.suppress
    "RUF001",  # polskie znaki typograficzne („ ” —) są celowe
    "RUF002",
    "RUF003",
    "B008",
]

[lint.per-file-ignores]
# Samotest celowo sięga po elementy prywatne i łapie szerokie wyjątki
"nixi/selftest.py" = ["B011", "PLW0603", "SIM117"]
